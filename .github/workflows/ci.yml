name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: cd ci-practice && ruff check .

  unit:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: cd ci-practice && pip install -r requirements.txt
      - run: cd ci-practice && pytest -v --junitxml=report-${{ matrix.python-version }}.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ matrix.python-version }}
          path: ci-practice/report-${{ matrix.python-version }}.xml
